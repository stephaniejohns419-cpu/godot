name: Compile Unrestricted Godot iOS Editor (ARM64 Darwin)

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot Source Branch/Tag (e.g., 4.3-stable)'
        required: true
        default: '4.3-stable'

jobs:
  build-darwin-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Engine Source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ github.event.inputs.godot_version }}

      - name: Setup iOS Toolchain and Build Systems
        run: |
          # Install standard SCons configuration tools
          brew install scons python3
          pip3 install cachecontrol

          # Explicitly set the active Xcode path to pull structural iPhoneOS platforms
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          
          # Verify iOS SDK presence natively on the runner
          xcodebuild -showsdks

      - name: Compile Tools Suite (ARM64 iOS Target)
        run: |
          # Build specifically for physical iOS hardware (Darwin-arm64) with full desktop-tools enabled
          scons platform=ios target=editor arch=arm64 tools=yes generate_bundle=yes vsproj=no -j$(sysctl -n hw.logicalcpu)

      - name: Structure Unsigned Payload
        run: |
          mkdir -p build/Payload
          
          # Move compiled .app directory structure into layout
          if [ -d "bin/Godot.app" ]; then
            cp -R bin/Godot.app build/Payload/
          else
            cp -R bin/godot.ios.editor.arm64.axwrapper/Godot.app build/Payload/ || cp -R bin/*.app build/Payload/
          fi
          
          cd build
          # Final wrapper for TrollStore installation compatibility
          zip -r ../Godot_Darwin_ARM64_Editor.ipa Payload/

      - name: Upload iOS Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot_Darwin_ARM64_Editor
          path: Godot_Darwin_ARM64_Editor.ipa
          if-no-files-found: error
