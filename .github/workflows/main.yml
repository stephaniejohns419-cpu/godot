name: Build Godot iOS Editor with Touch Support

on:
  workflow_dispatch:

jobs:
  build-ios-editor:
    runs-on: macos-15
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python and Scons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install scons
          brew install ccache

      - name: Configure SCons Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: godot-ios-touch-editor-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            godot-ios-touch-editor-ccache-${{ github.ref }}-
            godot-ios-touch-editor-ccache-

      - name: Compile Godot Engine (iOS Native + Complete Editor UI)
        run: |
          export SCONS_CACHE=~/.ccache
          
          # Force SCons to accept target=editor on iOS by stripping out the validation limits inline
          sed -i '' 's/check_editor_supported_platforms()/# bypassed/g' SConstruct || true
          
          # platform=ios ensures native mobile touch inputs are linked to DisplayServer out of the box
          scons platform=ios target=editor tools=yes ios_simulator=no arch=arm64 vsproj=no tests=no min_ios_version=14.0 use_static_cpp=yes -j$(sysctl -n hw.logicalcpu)

      - name: Link and Create App Bundle Structure
        run: |
          # Enforce absolute case-sensitive name synchronization across all structural outputs
          mkdir -p build/godot.ios.editor.arm64.app
          
          echo "Locating compiled static library assets inside bin/:"
          ls -la bin/
          
          LIB_FILE=$(ls bin/libgodot.ios.editor.arm64*.a 2>/dev/null | head -n 1)
          if [ -z "$LIB_FILE" ]; then
            LIB_FILE=$(ls bin/libgodot.ios.tools.arm64*.a 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$LIB_FILE" ]; then
            echo "Error: SCons did not output a valid .a static library file."
            exit 1
          fi
          
          echo "Found static library: $LIB_FILE"
          
          # Link the library directly into an executable binary matching the exact folder prefix name
          xcrun -sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=14.0 \
            -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore \
            -framework AudioToolbox -framework AVFoundation -framework CoreAudio -framework CoreMedia \
            -framework GameController -framework CoreMotion -framework Metal -framework MetalKit \
            -u _main $LIB_FILE -o build/godot.ios.editor.arm64.app/godot.ios.editor.arm64

          chmod 755 build/godot.ios.editor.arm64.app/godot.ios.editor.arm64

      - name: Generate Properties Configuration (Info.plist)
        run: |
          # CFBundleExecutable MUST match the exact filename created in the step above
          cat <<EOF > build/godot.ios.editor.arm64.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>godot.ios.editor.arm64</string>
              <key>CFBundleIdentifier</key>
              <string>org.godotengine.editor.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>GodotEditor</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>4.x</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Package Payload to Unsigned IPA
        run: |
          rm -rf ipa_out
          mkdir -p ipa_out/Payload
          
          # Maintain structural name alignment through full compression path
          cp -R build/godot.ios.editor.arm64.app ipa_out/Payload/
          
          chmod +x ipa_out/Payload/godot.ios.editor.arm64.app/godot.ios.editor.arm64
          
          cd ipa_out
          zip -r -y ../Godot_iOS_Touch_Editor.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-touch-editor-ipa
          path: Godot_iOS_Touch_Editor.ipa
